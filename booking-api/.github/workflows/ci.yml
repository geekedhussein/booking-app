# ===========================================================================
# CI PIPELINE  (V2.12 → Part XI: CI/CD)
#
# Runs on every push and PR, in a CLEAN environment — so "works on my machine"
# can never reach main. The key part for this project is `services:`: integration
# and e2e tests need REAL MongoDB and Redis, so CI provides them as containers
# and waits for their health checks before running anything.
# ===========================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check "src/**/*.js" "tests/**/*.js"

  test:
    name: Tests (unit, integration, e2e)
    runs-on: ubuntu-latest

    # Real backing services. `--health-cmd` makes the runner wait until each is
    # actually accepting connections before the steps run — the same
    # health-gated startup ordering as docker-compose. MongoDB isn't listed
    # here: it must start as a replica set (transactions need one), and service
    # containers can't take start-up arguments, so a step below starts it.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/booking_test?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-16-characters
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # A single-node replica set: start mongod with --replSet, initiate the set,
      # then wait until this node is the writable primary.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)" && break
            sleep 2
          done

      # Migrations must run before any test touches the database.
      - name: Apply migrations
        run: node src/db/migrate.js

      - name: Unit tests
        run: node --test --experimental-test-module-mocks "tests/unit/*.test.js"

      - name: Integration tests
        run: node --test "tests/integration/*.test.js"

      - name: End-to-end tests
        run: node --test "tests/e2e/*.test.js"

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test] # only build if quality and tests passed
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t booking-api:${{ github.sha }} .
