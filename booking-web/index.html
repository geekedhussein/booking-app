<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Find an open time and book it." />
    <meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Reserve</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        const t = localStorage.getItem('reserve.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
